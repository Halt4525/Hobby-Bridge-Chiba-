<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>土気と稲毛海岸 冬の朝</title>
<style>
  html, body { margin: 0; background: #0A1424; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =========================================================
   土気と稲毛海岸：冬の朝の気温はなぜ違う？（59秒・16:9）
   drawFrame(t) で t 秒の1コマを描く。数値はすべて依頼データのまま。
   ========================================================= */
const W = 1920, H = 1080, DURATION = 59;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Noto Sans CJK JP", "Noto Sans JP", "IPAGothic", sans-serif';

const C = {
  text: '#EEF3F9', sub: '#A9B8CC', dim: '#6F829C',
  cold: '#4DB2FF', coldL: '#A6DAFF', coldD: '#1F6FC0',
  warm: '#FF8A4C', warmL: '#FFC394', warmD: '#D9572A',
  hi: '#FFD866', ir: '#FF6F91', vapor: '#DDEBFF',
  gray: '#8E9BB0', grayL: '#B9C3D2',
};

/* ---------- 小道具 ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eout = k => 1 - Math.pow(1 - k, 3);
const eback = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const P = (t, a, b) => clamp((t - a) / (b - a));
const frac = x => x - Math.floor(x);
const fmt = (v, d = 1) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);

function A(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= Math.min(1, a); fn(); ctx.restore(); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function poly(pts, close = true) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  if (close) ctx.closePath();
}
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = `${o.w || 400} ${o.s || 32}px ${FONT}`;
  ctx.textAlign = o.al || 'left'; ctx.textBaseline = o.bl || 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.stroke; ctx.strokeStyle = o.sc || 'rgba(6,12,24,0.85)'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.c || C.text; ctx.fillText(s, x, y);
  ctx.restore();
}
function tw(s, size, w = 400) { ctx.save(); ctx.font = `${w} ${size}px ${FONT}`; const m = ctx.measureText(s).width; ctx.restore(); return m; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A1 = hex2rgb(a), B1 = hex2rgb(b); return `rgb(${A1.map((v, i) => Math.round(lerp(v, B1[i], k))).join(',')})`; }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }
function radial(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function arrowHead(x, y, ang, size, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(size * 0.55, 0); ctx.lineTo(-size * 0.75, size * 0.62); ctx.lineTo(-size * 0.75, -size * 0.62); ctx.closePath(); ctx.fill();
  ctx.restore();
}
/* 波線の矢印（赤外線・熱など） */
function wavy(x0, y0, x1, y1, amp, waves, phase, col, lw, head = true) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 2) return;
  const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const N = 48, endS = head ? 1 - (lw * 2.2) / L : 1;
  for (let i = 0; i <= N; i++) {
    const s = (i / N) * endS;
    const env = Math.min(1, s * 5, (1 - s) * 5);
    const off = Math.sin(s * waves * Math.PI * 2 + phase) * amp * env;
    const px = x0 + dx * s + nx * off, py = y0 + dy * s + ny * off;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke(); ctx.restore();
  if (head) arrowHead(x1 - ux * lw * 0.6, y1 - uy * lw * 0.6, Math.atan2(uy, ux), lw * 3.0, col);
}
/* 下から上へ流れ続ける波線矢印 */
function rising(t, x, yBot, yTop, len, speed, offset, col, lw, amp, drift = 0, alpha = 1) {
  const p = frac(t * speed + offset);
  const travel = (yBot - yTop) - len;
  const tail = yBot - travel * p, headY = tail - len;
  const a = Math.sin(Math.PI * p) * alpha;
  A(a, () => wavy(x + drift * p, tail, x + drift * (p + 0.15), headY, amp, 1.6, t * 7 + offset * 9, col, lw));
}
function thermo(x, yb, h, level, col, a = 1) {
  A(a, () => {
    const tw2 = 18, br = 22, top = yb - h;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(232,240,250,0.92)';
    rr(x - tw2 / 2, top, tw2, h, tw2 / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, yb, br, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#16253B';
    rr(x - tw2 / 2, top, tw2, h, tw2 / 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, yb, br, 0, Math.PI * 2); ctx.fill();
    const lt = yb - br - (h - br - 12) * clamp(level);
    ctx.fillStyle = col;
    rr(x - tw2 / 2 + 4, lt, tw2 - 8, yb - lt, (tw2 - 8) / 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, yb, br - 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(232,240,250,0.5)'; ctx.lineWidth = 2;
    for (let i = 1; i < 5; i++) { const yy = yb - br - (h - br - 12) * i / 5; ctx.beginPath(); ctx.moveTo(x + tw2 / 2 + 5, yy); ctx.lineTo(x + tw2 / 2 + 13, yy); ctx.stroke(); }
  });
}
function moon(x, y, r, a = 1) {
  A(a, () => {
    radial(x, y, r * 3.2, '#FFF0C8', 0.30);
    ctx.fillStyle = '#FFF3CF'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(214,196,150,0.40)';
    [[-0.3, -0.2, 0.18], [0.25, 0.15, 0.22], [-0.05, 0.42, 0.12]].forEach(c => { ctx.beginPath(); ctx.arc(x + c[0] * r, y + c[1] * r, c[2] * r, 0, Math.PI * 2); ctx.fill(); });
  });
}
const STARS = (() => { const r = rng(11); return Array.from({ length: 110 }, () => ({ x: r() * W, y: 110 + r() * 560, s: 0.7 + r() * 1.7, p: r() * 6.28 })); })();
function stars(t, a, ymax = 650, x0 = 0, x1 = W) {
  ctx.save(); ctx.fillStyle = '#DCE8FF';
  for (const s of STARS) {
    if (s.y > ymax || s.x < x0 || s.x > x1) continue;
    const k = 0.55 + 0.45 * Math.sin(t * 2.1 + s.p);
    ctx.globalAlpha = a * k * 0.75; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function panel(x, y, w, h, stroke = 'rgba(160,185,215,0.22)', fill = 'rgba(21,38,63,0.72)') {
  rr(x, y, w, h, 22); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke();
}
function chip(x, y, s, col, size = 26) {
  const w = tw(s, size, 700) + 34, h = size + 20;
  rr(x, y - h / 2, w, h, h / 2); ctx.fillStyle = rgba(col, 0.16); ctx.fill(); ctx.strokeStyle = rgba(col, 0.75); ctx.lineWidth = 2; ctx.stroke();
  txt(s, x + 17, y + 1, { s: size, w: 700, c: col });
  return w;
}
function pin(x, y, col, r, ringT = null) {
  if (ringT !== null) { const ph = frac(ringT * 0.7); A(1 - ph, () => { ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + ph * 30, 0, Math.PI * 2); ctx.stroke(); }); }
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#0A1424'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * 0.36, 0, Math.PI * 2); ctx.fill();
}
/* 点線の曲線矢印（途中まで描ける） */
function curveArrow(p, q, bend, prog, col, lw = 3) {
  if (prog <= 0) return;
  const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
  const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy);
  const cx = mx - dy / L * bend, cy = my + dx / L * bend;
  const pt = s => [(1 - s) * (1 - s) * p[0] + 2 * (1 - s) * s * cx + s * s * q[0], (1 - s) * (1 - s) * p[1] + 2 * (1 - s) * s * cy + s * s * q[1]];
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash([9, 7]); ctx.lineCap = 'round';
  ctx.beginPath(); const N = 40;
  for (let i = 0; i <= N; i++) { const s = (i / N) * prog * 0.93; const [x, y] = pt(s); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.restore();
  if (prog > 0.95) { const a = pt(0.93), b = pt(0.86); arrowHead(a[0], a[1], Math.atan2(a[1] - b[1], a[0] - b[0]), lw * 4, col); }
  return pt(0.5);
}

/* =========================================================
   地図（模式図）：経度・緯度はおおよその値
   ========================================================= */
const COAST = [[139.85, 35.80], [139.97, 35.690], [140.000, 35.672], [140.025, 35.655], [140.045, 35.640], [140.065, 35.627], [140.085, 35.612], [140.098, 35.598], [140.108, 35.580], [140.112, 35.560], [140.105, 35.545], [140.085, 35.528], [140.060, 35.505], [140.035, 35.480], [140.010, 35.455], [139.975, 35.430], [139.94, 35.39], [139.85, 35.30]];
const CITY = [[140.025, 35.655], [140.045, 35.640], [140.065, 35.627], [140.085, 35.612], [140.098, 35.598], [140.108, 35.580], [140.112, 35.560], [140.105, 35.545], [140.130, 35.540], [140.160, 35.528], [140.195, 35.515], [140.230, 35.500], [140.265, 35.488], [140.300, 35.492], [140.325, 35.505], [140.318, 35.530], [140.300, 35.560], [140.285, 35.595], [140.270, 35.625], [140.255, 35.655], [140.230, 35.675], [140.195, 35.685], [140.160, 35.690], [140.125, 35.705], [140.090, 35.705], [140.060, 35.690], [140.040, 35.675]];
const PTS = { inage: [140.072, 35.632], toke: [140.268, 35.522], chiba: [140.103, 35.602], sakura: [140.222, 35.722], mobara: [140.293, 35.428] };

function mapT(t) {
  const intro = eout(P(t, 0, 1.2));
  const m = ease(P(t, 8.3, 9.2));
  return {
    cx: lerp(960, 330, m), cy: lerp(525, 578, m),
    k: lerp(lerp(1760, 1900, intro), 1000, m),
    a: intro * (1 - P(t, 12.9, 13.3)), m,
  };
}
const proj = (p, T) => [T.cx + (p[0] - 140.18) * 0.8135 * T.k, T.cy - (p[1] - 35.575) * T.k];

function drawMap(t) {
  const T = mapT(t); if (T.a <= 0.001) return;
  A(T.a, () => {
    const pr = p => proj(p, T), sc = T.k / 1900;
    const [x0, y0] = pr([139.95, 35.75]), [x1, y1] = pr([140.41, 35.40]);
    const big = 1 - P(t, 8.15, 8.5), mini = P(t, 9.0, 9.4);
    // 地図の土台
    ctx.save(); rr(x0, y0, x1 - x0, y1 - y0, 20 * sc + 4); ctx.fillStyle = '#1C2C44'; ctx.fill(); ctx.clip();
    poly(COAST.map(pr)); ctx.fillStyle = '#0E2136'; ctx.fill();
    const ip = pr(PTS.inage), tp = pr(PTS.toke), cp = pr(PTS.chiba), sp = pr(PTS.sakura);
    A(big, () => { radial(ip[0], ip[1], 250 * sc, C.warm, 0.32); radial(tp[0], tp[1], 250 * sc, C.cold, 0.30); });
    A(mini, () => { radial(cp[0], cp[1], 120 * sc + 30, C.warm, 0.30); radial(sp[0], sp[1], 120 * sc + 30, C.cold, 0.30); });
    poly(COAST.slice(1, -2).map(pr), false); ctx.strokeStyle = 'rgba(255,170,120,0.85)'; ctx.lineWidth = 3 * sc + 1; ctx.stroke();
    poly(CITY.map(pr)); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
    ctx.setLineDash([10 * sc + 2, 7 * sc + 2]); ctx.strokeStyle = 'rgba(220,232,248,0.78)'; ctx.lineWidth = 2.6 * sc + 0.8; ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    rr(x0, y0, x1 - x0, y1 - y0, 20 * sc + 4); ctx.strokeStyle = 'rgba(160,185,215,0.35)'; ctx.lineWidth = 2; ctx.stroke();

    // ---- 大きい地図のラベル（つかみ） ----
    A(big, () => {
      A(P(t, 1.2, 1.8), () => txt('東京湾', ...pr([140.0, 35.53]), { s: 32, w: 700, c: '#7F9BBE', al: 'center' }));
      A(P(t, 0.6, 1.2) * (1 - P(t, 6.0, 6.4)), () => txt('千葉市', ...pr([140.195, 35.612]), { s: 36, w: 700, c: 'rgba(230,240,250,0.5)', al: 'center' }));
      A(P(t, 0.8, 1.4), () => {
        const nx = x1 - 46, ny = y0 + 62;
        ctx.strokeStyle = C.sub; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(nx, ny + 26); ctx.lineTo(nx, ny - 14); ctx.stroke();
        arrowHead(nx, ny - 18, -Math.PI / 2, 14, C.sub); txt('N', nx, ny + 46, { s: 24, w: 700, c: C.sub, al: 'center' });
        txt('模式図（位置はおおよそ）', x0 + 18, y1 - 22, { s: 20, c: C.dim });
      });
      // 稲毛海岸・土気のラベル
      A(P(t, 1.3, 1.8), () => {
        txt('稲毛海岸', ip[0] - 40, ip[1] - 58, { s: 44, w: 700, c: C.warmL, al: 'right', stroke: 6 });
        txt('海沿い・美浜区', ip[0] - 40, ip[1] - 12, { s: 26, c: C.text, al: 'right', stroke: 5 });
      });
      A(P(t, 1.7, 2.2), () => {
        txt('土気', tp[0] + 34, tp[1] - 14, { s: 44, w: 700, c: C.coldL, stroke: 6 });
        txt('内陸の台地・緑区', tp[0] + 34, tp[1] + 32, { s: 26, c: C.text, stroke: 5 });
      });
      // 温度計（つかみ）
      const ta = P(t, 2.2, 2.7) * (1 - P(t, 5.8, 6.2));
      const lv = eout(P(t, 2.4, 3.6));
      thermo(ip[0] - 260, ip[1] + 70, 150, lerp(0.15, 0.72, lv), C.warm, ta);
      thermo(tp[0] + 300, tp[1] + 80, 150, lerp(0.15, 0.26, lv), C.cold, ta);
      A(ta * P(t, 3.0, 3.4), () => txt('？', tp[0] + 345, tp[1] - 40, { s: 64, w: 700, c: C.coldL }));
    });

    // ---- 観測点（代用）----
    const ca = P(t, 6.3, 6.7), sa = P(t, 6.6, 7.0), ma = P(t, 7.1, 7.5);
    A(big, () => {
      const ar1 = eout(P(t, 6.4, 7.1)), ar2 = eout(P(t, 6.7, 7.5));
      const m1 = curveArrow([ip[0] + 6, ip[1] + 14], [cp[0] - 4, cp[1] - 16], -26, ar1, C.warmL, 3);
      const m2 = curveArrow([tp[0] - 4, tp[1] - 20], [sp[0] + 6, sp[1] + 20], -60, ar2, C.coldL, 3);
      A(P(t, 7.1, 7.4), () => { if (m2) txt('代用', m2[0] + 18, m2[1], { s: 26, w: 700, c: C.coldL, stroke: 5 }); });
      A(P(t, 6.9, 7.2), () => { if (m1) txt('代用', m1[0] + 22, m1[1] - 6, { s: 26, w: 700, c: C.warmL, stroke: 5 }); });
      A(ca, () => {
        txt('千葉', cp[0] - 26, cp[1] + 40, { s: 34, w: 700, c: C.warm, al: 'right', stroke: 6 });
        txt('中央区・東京湾岸', cp[0] - 26, cp[1] + 80, { s: 24, c: C.text, al: 'right', stroke: 5 });
      });
      A(sa, () => {
        txt('佐倉', sp[0] + 30, sp[1] - 12, { s: 34, w: 700, c: C.cold, stroke: 6 });
        txt('下総台地・内陸', sp[0] + 30, sp[1] + 26, { s: 24, c: C.text, stroke: 5 });
      });
      A(ma, () => txt('茂原（参考）', pr(PTS.mobara)[0] + 24, pr(PTS.mobara)[1], { s: 24, c: C.grayL, stroke: 5 }));
      // 説明ボックス
      A(P(t, 6.2, 6.7) * (1 - P(t, 8.0, 8.3)), () => {
        panel(1370, 205, 490, 286);
        txt('観測点がないので代用', 1400, 250, { s: 32, w: 700, c: C.hi });
        txt('土気・稲毛海岸には', 1400, 300, { s: 26, c: C.sub });
        txt('気象庁の観測点がありません', 1400, 336, { s: 26, c: C.sub });
        ctx.fillStyle = C.warm; ctx.beginPath(); ctx.arc(1412, 398, 10, 0, 7); ctx.fill();
        txt('千葉 ＝ 稲毛海岸の代わり', 1436, 398, { s: 28, w: 700 });
        ctx.fillStyle = C.cold; ctx.beginPath(); ctx.arc(1412, 448, 10, 0, 7); ctx.fill();
        txt('佐倉 ＝ 土気の代わり', 1436, 448, { s: 28, w: 700 });
      });
    });
    // ---- 小さい地図のラベル ----
    A(mini, () => {
      txt('千葉', cp[0] - 20, cp[1] + 2, { s: 26, w: 700, c: C.warm, al: 'right', stroke: 5 });
      txt('佐倉', sp[0] + 20, sp[1], { s: 26, w: 700, c: C.cold, stroke: 5 });
      txt('茂原', pr(PTS.mobara)[0] + 18, pr(PTS.mobara)[1], { s: 22, c: C.grayL, stroke: 5 });
      txt('観測点の位置（模式図）', x0, y1 + 26, { s: 20, c: C.dim });
      // 凡例
      const L = [[C.warm, '千葉（湾岸）', '稲毛海岸の代わり'], [C.cold, '佐倉（台地）', '土気の代わり'], [C.gray, '茂原', '参考']];
      L.forEach((r, i) => {
        const y = 196 + i * 62;
        rr(x0, y - 14, 28, 28, 6); ctx.fillStyle = r[0]; ctx.fill();
        txt(r[1], x0 + 42, y, { s: 28, w: 700 });
        txt(r[2], x0 + 42 + tw(r[1], 28, 700) + 12, y + 2, { s: 22, c: C.sub });
      });
    });
    // ピン
    const popI = eback(P(t, 1.0, 1.5)), popT = eback(P(t, 1.4, 1.9));
    const pr0 = 13 * sc + 4;
    A(big * P(t, 1.0, 1.2), () => pin(ip[0], ip[1], C.warm, pr0 * popI, t));
    A(big * P(t, 1.4, 1.6), () => pin(tp[0], tp[1], C.cold, pr0 * popT, t));
    A(mini * 0.45, () => { pin(ip[0], ip[1], C.warmL, pr0 * 0.75); pin(tp[0], tp[1], C.coldL, pr0 * 0.75); });
    A(ca, () => pin(cp[0], cp[1], C.warm, pr0 * eback(ca), big > 0.5 ? t : null));
    A(sa, () => pin(sp[0], sp[1], C.cold, pr0 * eback(sa), big > 0.5 ? t : null));
    A(ma, () => pin(...pr(PTS.mobara), C.gray, pr0 * 0.85 * eback(ma)));
  });
}

/* =========================================================
   棒グラフ（6〜13秒）
   ========================================================= */
function bar(cx, w, v, col, yOf) {
  const y0 = yOf(0), y1 = yOf(v); if (Math.abs(y1 - y0) < 0.5) return;
  const top = Math.min(y0, y1), h = Math.abs(y1 - y0);
  const g = ctx.createLinearGradient(0, top, 0, top + h);
  g.addColorStop(0, col); g.addColorStop(1, mix(col.length === 7 ? col : '#8E9BB0', '#0A1424', 0.25));
  rr(cx - w / 2, top, w, h, Math.min(8, h / 2)); ctx.fillStyle = g; ctx.fill();
}
